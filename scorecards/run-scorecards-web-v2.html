<title>ICPI Run Scorecards v2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: field clipboard. Sticky bar (run + section nav), scoreboard and check map first, then the card in Doc order. */
:root {
  --bg: #f3f4f1; --surface: #ffffff; --ink: #1d232a; --muted: #5e6872; --line: #d9ddd6;
  --accent: #e35d12; --red: #b9352f; --blue: #2457a6; --pass: #23794a; --fail: #b9352f; --na: #7c858d;
  --warn: #a86a00; --warn-bg: #fdf3dc; --chip: #eef0ec; --open: #e3e6e0;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --barh: 104px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15191d; --surface: #1d2227; --ink: #e8ebe6; --muted: #9aa4ad; --line: #2e353c;
  --accent: #f07a3a; --red: #e06a62; --blue: #7aa5ea; --pass: #46b37a; --fail: #e06a62; --na: #8e979f;
  --warn: #e3a43a; --warn-bg: #3a2f17; --chip: #252b31; --open: #303840; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15191d; --surface: #1d2227; --ink: #e8ebe6; --muted: #9aa4ad; --line: #2e353c;
  --accent: #f07a3a; --red: #e06a62; --blue: #7aa5ea; --pass: #46b37a; --fail: #e06a62; --na: #8e979f;
  --warn: #e3a43a; --warn-bg: #3a2f17; --chip: #252b31; --open: #303840; color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--sans); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 0 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; flex-direction: column; gap: 8px; padding-block: 10px; }
.row1 { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.brand { font-weight: 700; letter-spacing: .02em; margin-right: auto; }
.brand span { color: var(--accent); } .brand em { font: 500 11px var(--mono); color: var(--muted); font-style: normal; margin-left: 6px; }
.sync { font: 12px var(--mono); color: var(--muted); }
.nav { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.nav a { font-size: 13px; text-decoration: none; color: var(--ink); padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); white-space: nowrap; }
.nav a b { font: 500 11px var(--mono); color: var(--muted); margin-left: 4px; }
.nav a.full b { color: var(--pass); }
.nav .sp { flex: 1; }
.nav select { width: auto; padding: 4px 8px; font-size: 13px; }
select, input, button { font: inherit; color: var(--ink); }
select, input { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 100%; min-width: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 12px; cursor: pointer; }
.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.runpick { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.runpick select { width: auto; max-width: 60vw; }
section { scroll-margin-top: calc(var(--barh) + 12px); }
h1 { font-size: 24px; margin: 22px 0 2px; text-wrap: balance; }
h2 { font-size: 19px; margin: 34px 0 4px; text-wrap: balance; }
h2.red { color: var(--red); } h2.blue { color: var(--blue); }
h3 { font-size: 13px; margin: 20px 0 6px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: flex; gap: 10px; align-items: baseline; }
h3 .pp { font: 500 12px var(--mono); letter-spacing: 0; text-transform: none; }
.meta { color: var(--muted); font: 13px var(--mono); margin: 0 0 14px; }
.lead { color: var(--muted); margin: 0 0 8px; max-width: 72ch; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px 14px; }
.fields label, .f { display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--muted); min-width: 0; }
.f small { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
.tin { display: flex; gap: 4px; }
.tin button { padding: 4px 8px; font: 500 11px var(--mono); color: var(--muted); }
/* scoreboard */
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-width: 0; }
.tile .k { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.tile .v { font: 600 30px/1.1 var(--mono); font-variant-numeric: tabular-nums; margin-top: 4px; }
.tile .s { font: 12px var(--mono); color: var(--muted); margin-top: 2px; }
.tile.red .v { color: var(--red); } .tile.blue .v { color: var(--blue); } .tile.win .v { color: var(--accent); }
.meter { height: 5px; background: var(--open); border-radius: 3px; margin-top: 8px; overflow: hidden; display: flex; }
.meter i { display: block; height: 100%; }
@media (max-width: 640px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
/* check map */
.map { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-top: 10px; overflow-x: auto; }
.map table { border-collapse: collapse; }
.map td { padding: 3px 8px 3px 0; vertical-align: middle; }
.map td.g { font: 500 12px var(--mono); color: var(--muted); white-space: nowrap; }
.map th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); text-align: left; padding: 0 8px 4px 0; font-weight: 600; }
.cells { display: flex; gap: 3px; flex-wrap: nowrap; }
.cell { width: 18px; height: 18px; border-radius: 3px; border: 0; padding: 0; background: var(--open); cursor: pointer; }
.cell.Pass { background: var(--pass); } .cell.Fail { background: var(--fail); } .cell.NA { background: var(--na); opacity: .55; }
.cell.warn { box-shadow: inset 0 0 0 2px var(--warn); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend .cell { width: 12px; height: 12px; cursor: default; }
/* phase timeline */
.tl { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-top: 10px; }
.tl .lane { position: relative; height: 30px; background: var(--chip); border-radius: 4px; }
.tl .seg2 { position: absolute; top: 3px; bottom: 3px; border-radius: 3px; background: var(--accent); color: #fff; font: 500 11px/24px var(--mono); padding: 0 6px; overflow: hidden; white-space: nowrap; min-width: 3px; }
.tl .seg2:nth-child(2) { background: color-mix(in srgb, var(--accent) 78%, var(--ink)); }
.tl .seg2:nth-child(3) { background: color-mix(in srgb, var(--accent) 60%, var(--ink)); }
.tl .seg2:nth-child(4) { background: color-mix(in srgb, var(--accent) 45%, var(--ink)); }
.tl .ax { display: flex; justify-content: space-between; font: 11px var(--mono); color: var(--muted); margin-top: 4px; }
.tl .none { color: var(--muted); font-size: 13px; }
/* phase record */
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table.ph { width: 100%; border-collapse: collapse; min-width: 760px; }
.ph th, .ph td { padding: 7px 9px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.ph tr:last-child td { border-bottom: 0; }
.ph th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; background: var(--chip); }
.ph td.dur { font: 13px var(--mono); color: var(--muted); white-space: nowrap; padding-top: 14px; }
/* checks */
.checks { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.chk { display: grid; gap: 8px 12px; padding: 10px 12px; border-bottom: 1px solid var(--line); align-items: start; scroll-margin-top: calc(var(--barh) + 12px); }
.chk:last-child { border-bottom: 0; }
.chk.red { grid-template-columns: minmax(220px, 2.2fr) auto minmax(120px, 1fr) minmax(140px, 1.3fr); }
.chk.blue { grid-template-columns: minmax(200px, 2fr) minmax(90px, .7fr) minmax(120px, 1fr) auto minmax(140px, 1.3fr); }
.hd { display: flex; gap: 8px; min-width: 0; }
.hd .id { font: 500 13px var(--mono); color: var(--muted); min-width: 34px; }
.res { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 8px 10px; min-width: 50px; background: var(--surface); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on[data-v="Pass"] { background: var(--pass); color: #fff; }
.seg button.on[data-v="Fail"] { background: var(--fail); color: #fff; }
.seg button.on[data-v="N/A"] { background: var(--na); color: #fff; }
.hint { font: 500 11px var(--mono); }
.hint:empty { display: none; }
.hint button { padding: 2px 7px; font: inherit; border-radius: 999px; border-color: var(--line); background: var(--chip); }
.hint .bad { color: var(--warn); }
.chk.warn { background: var(--warn-bg); }
.chk.warn .note input { border-color: var(--warn); }
.chk.off { opacity: .45; }
#card[data-filter="open"] .chk:not(.is-open) { display: none; }
#card[data-filter="fail"] .chk:not(.is-fail) { display: none; }
#card[data-filter="why"] .chk:not(.warn):not(.disagree) { display: none; }
@media (max-width: 760px) {
  .chk.red, .chk.blue { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .chk .hd, .chk .res, .chk .note { grid-column: 1 / -1; }
}
.callout { margin-top: 10px; padding: 10px 12px; border-left: 4px solid var(--red); background: var(--chip); border-radius: 0 6px 6px 0; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.tools .msg { font: 12px var(--mono); color: var(--muted); }
.empty { margin: 28px 0 16px; padding: 20px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); }
.newrun { display: flex; gap: 8px; flex-wrap: wrap; max-width: 760px; margin-top: 12px; align-items: center; }
.newrun input { flex: 1 1 220px; } .newrun select { flex: 1 1 220px; width: auto; }
table.ov { width: 100%; border-collapse: collapse; min-width: 640px; }
.ov th, .ov td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; }
.ov th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--chip); font-weight: 600; }
.ov td.num, .ov th.num { text-align: right; font: 13px var(--mono); font-variant-numeric: tabular-nums; }
.ov tbody tr { cursor: pointer; } .ov tbody tr:hover { background: var(--chip); }
.ov tr:last-child td { border-bottom: 0; }
.howto li { margin: 3px 0; }
@media (prefers-reduced-motion: no-preference) { .seg button, .cell { transition: background .12s; } }
</style>

<div class="bar" id="bar"><div class="wrap">
  <div class="row1">
    <div class="brand">ICPI <span>Run Scorecards</span><em>v2</em></div>
    <div class="runpick">
      <select id="run-select" aria-label="Choose run"><option value="">All runs</option></select>
      <button id="new-run-btn">New run</button>
    </div>
    <div class="sync" id="sync">Connecting…</div>
  </div>
  <nav class="nav" id="nav" hidden></nav>
</div></div>

<div class="wrap">
  <div id="new-run" class="newrun" hidden>
    <input id="new-run-id" placeholder="Run ID, e.g. OULU-2026-10-28-R1" aria-label="New run ID">
    <select id="copy-from" aria-label="Copy crew, drones and Blue targets from"><option value="">Start empty</option></select>
    <button class="primary" id="create-run">Create run</button>
  </div>
  <div id="home">
    <div class="empty">
      <strong>All runs.</strong> Open a run from the list, or press <b>New run</b>. A new run can copy the crew, drones and Blue targets
      from an earlier run. Everything is saved straight away and the whole team sees the same card.
    </div>
    <div class="tbl"><table class="ov" id="overview"></table></div>
  </div>
  <div id="card" hidden></div>
</div>

<script>
const PHASES = [["P1", "Low flight"], ["P2", "Distance flight"], ["P3", "Approach (non-contact “strike”)"], ["P4", "Hover (optional)"]];
const RUN_FIELDS = [
  ["run_id", "Run ID"], ["date", "Date (UTC)"], ["site", "Site"], ["plan_start", "Planned start UTC"],
  ["start", "Actual start UTC"], ["end", "Actual end UTC"], ["pause", "No-drone pause before / after (UTC)"],
  ["pilots", "Pilots / operators"], ["observer", "Observer"], ["drones", "Drones: IDs and exact models"],
  ["n_drones", "Number of drones"], ["mode", "Mode: manual / autonomous / mixed"],
  ["clocks", "Clocks checked on UTC: offsets"], ["tarps", "Tarps placed at 500 m / 1 km / 2 km"],
  ["wx_start", "Weather at start (Vaisala)"], ["wx_end", "Weather at end (Vaisala)"],
  ["outcome", "Outcome: Ended / Aborted (reason)"], ["data", "Data saved: SD cards, files, folder"], ["notes", "Notes"],
];
const NOW_FIELDS = { "run.date": "date", "run.plan_start": "time", "run.start": "time", "run.end": "time" };
const COPY_FIELDS = ["site", "pilots", "observer", "drones", "n_drones", "mode"];
// [id, group, check, value label]
const RED = [
  ["R1", "RUN", "Run started at the planned time", "Delay (s)"],
  ["R2", "RUN", "No-drone pause before and after the run", ""],
  ["R3", "RUN", "All clocks on UTC (drones, laptop, weather)", "Max offset (s)"],
  ["R4", "RUN", "Weather recorded at start and end (Vaisala)", ""],
  ["R5", "RUN", "Battery level and temperature recorded for each drone", ""],
  ["R6", "RUN", "No technical failure (battery, lost link, crash)", "What failed"],
  ["R7", "RUN", "Run not aborted (weather, safety, airspace, wind, angle, rain)", "Reason"],
  ["R8", "RUN", "Data saved and checked after the run (SD cards, Betaflight length and speed)", "Folder"],
  ["R9", "RUN", "Pre-flight checklist done and signed for every drone", "Signed by"],
  ["R10", "RUN", "Test area and airspace confirmed clear before take-off (NOTAM / range control)", "Confirmed by / time"],
  ["R11", "RUN", "Wind and temperature stayed within the drones' limits", "Max wind (m/s) / min temp (°C)"],
  ["R12", "RUN", "Every drone's log covers the whole flight with no missing parts", "Gaps (s)"],
  ["R13", "RUN", "Phase changes marked live (radio call + time written) so IRIS data can be cut", "Marks written"],
  ["L1", "P1", "Planned route flown: straight-in and crossing passes", ""],
  ["L2", "P1", "Every planned altitude flown (large drones 2–10 m, small under 1 m)", "Altitudes flown (m)"],
  ["L3", "P1", "Formation and altitude held", ""],
  ["L4", "P1", "GPS good through the phase", "Min satellites"],
  ["L5", "P1", "Crossing passes flown at the planned distance from the radar", "Pass distance (m)"],
  ["D1", "P2", "Started at the planned distance (4–5 km from the radar)", "Start distance (m)"],
  ["D2", "P2", "Planned route and altitude flown", ""],
  ["D3", "P2", "All drones started together and kept their spacing", ""],
  ["D4", "P2", "All drones finished the route", "Finished / started"],
  ["D5", "P2", "Planned speed held on the distance leg", "Speed (m/s)"],
  ["A1", "P3", "Approach flown toward the target as planned", ""],
  ["A2", "P3", "Stopped at the planned stand-off point (no contact)", "Closest distance (m)"],
  ["A3", "P3", "Speed and timing as planned", "Speed (m/s)"],
  ["A4", "P3", "All drones reached the end point", "Reached / started"],
  ["A5", "P3", "Spacing between drones kept on the approach", "Min spacing (m)"],
  ["H1", "P4", "Hover held over the target for the planned time", "Hover time (s)"],
  ["H2", "P4", "Position stayed steady over the tarp (GPS check)", "Drift (m)"],
  ["H3", "P4", "Hover altitude held", "Altitude change (m)"],
];
// [id, group, check, target hint, value label]
const BLUE = [
  ["B1", "RUN", "IRIS data covers the whole run, no gaps", "", "Gaps (s)"],
  ["B2", "RUN", "IRIS clock matches UTC", "≤ s", "Offset (s)"],
  ["B3", "RUN", "IRIS settings for the run recorded (mode, sensitivity, set height / elevation)", "", "Settings"],
  ["B4", "RUN", "IRIS position and facing checked against our survey", "≤ m", "Position difference (m)"],
  ["B5", "RUN", "IRIS data can be cut by our phase marks (every phase window present)", "", "Phases found"],
  ["BL1", "P1", "Low drone detected at each flown altitude", "", "Lowest detected altitude (m)"],
  ["BL2", "P1", "Detected early enough", "≥ m", "First detection distance (m)"],
  ["BL3", "P1", "Track held", "≤ s gap", "Breaks / longest gap (s)"],
  ["BL4", "P1", "Classified as a drone", "≤ s", "Time to classify (s)"],
  ["BL5", "P1", "If tracking failed, why: too low / too far / drones too close / not flying straight at the radar / weather", "", "Reason"],
  ["BL6", "P1", "Height shown correctly at low altitude", "≤ m", "Height error (m)"],
  ["BD1", "P2", "Detected early enough", "≥ m", "First detection distance (m)"],
  ["BD2", "P2", "Position matched our GPS", "≤ m", "Distance / height error (m)"],
  ["BD3", "P2", "Speed and direction shown correctly", "", "Speed error (m/s)"],
  ["BD4", "P2", "Every drone got its own track", "", "Tracks / drones, time until all (s)"],
  ["BD5", "P2", "No tracks merged or swapped between drones", "", "Merges / swaps"],
  ["BD6", "P2", "Accuracy held at long range", "", "Error near / far (m)"],
  ["BD7", "P2", "Longest distance at which the drone was still tracked", "≥ m", "Max tracked distance (m)"],
  ["BD8", "P2", "No false tracks or alarms on other targets (birds, cars) during the phase", "≤", "False tracks / alarms"],
  ["BA1", "P3", "Alarm before the stand-off point", "≥ m", "Distance at first alarm (m)"],
  ["BA2", "P3", "Quick from detection to alarm", "≤ s", "Detection → alarm (s)"],
  ["BA3", "P3", "Track held until the end", "", "Breaks"],
  ["BA4", "P3", "Each drone tracked separately", "", "Tracks / drones"],
  ["BA5", "P3", "Alarm stayed on until the drones stopped", "", "Alarm dropped for (s)"],
  ["BH1", "P4", "Track kept while hovering", "", "Lost for (s)"],
  ["BH2", "P4", "Still classified as a drone while hovering; note if the data changed", "", "What changed"],
  ["BH3", "P4", "Position accurate while hovering (compared with our GPS)", "≤ m", "Position error (m)"],
];
const GROUPS = [["RUN", "Run checks"], ...PHASES.map(([id, n]) => [id, id + " " + n])];
const BLUE_INFO = [["iris_received", "IRIS data received (date, file names)"], ["iris_window", "Covers UTC from – to"], ["iris_reviewer", "Reviewer"]];
const ALL = [...RED.map(r => ["red", r[0], r[1], r[2], "", r[3]]), ...BLUE.map(r => ["blue", r[0], r[1], r[2], r[3], r[4]])];
const BY_ID = Object.fromEntries(ALL.map(r => [r[1], r]));

let db = null, dl = null, current = null, state = null, local = false, docUnsub = null, filter = "all";
let allRuns = {};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const slug = s => s.trim().replace(/[^A-Za-z0-9_.~:@+-]+/g, "-").replace(/^[.]+|[.]+$/g, "").slice(0, 120);
const blank = id => ({ run: { run_id: id }, phases: {}, items: {}, blue: {}, created_utc: new Date().toISOString() });
const use = n => window.claude?.use ? window.claude.use(n) : Promise.resolve(null);
const setSync = t => { $("sync").textContent = t; };
const utcTime = () => new Date().toISOString().slice(11, 19);

// ---------- scoring (pure) ----------
const num = s => { const m = String(s ?? "").replace(",", ".").match(/-?\d+(?:\.\d+)?/); return m ? parseFloat(m[0]) : null; };
const isOff = (s, g) => g !== "RUN" && s.phases?.[g]?.used === "Not used";
function suggestion(s, id) {
  const [team, , , , hint, vl] = BY_ID[id];
  if (team !== "blue" || !/^[≥≤]/.test(hint) || vl.includes("/")) return "";
  const it = s.items?.[id] || {}, t = String(it.target || "").trim(), v = num(it.value), tv = num(t);
  if (v === null || tv === null) return "";
  const op = (t.match(/^(≥|>=|≤|<=|>|<)/) || [])[1] || hint[0];
  const ok = { "≥": v >= tv, ">=": v >= tv, ">": v > tv, "≤": v <= tv, "<=": v <= tv, "<": v < tv }[op];
  return ok ? "Pass" : "Fail";
}
function tally(s) {
  const z = () => ({ Pass: 0, Fail: 0, "N/A": 0, open: 0, why: 0 });
  const out = { red: z(), blue: z(), groups: {}, blueFails: [], states: {} };
  for (const [team, id, g] of ALL) {
    const it = s.items?.[id] || {}, off = isOff(s, g);
    const res = off ? "N/A" : (it.result || "open");
    const why = !off && (res === "Fail" || res === "N/A") && !String(it.note || "").trim();
    const sug = off ? "" : suggestion(s, id);
    out.states[id] = { res, off, why, sug, disagree: !!sug && (res === "Pass" || res === "Fail") && res !== sug };
    (out.groups[g] ||= { red: z(), blue: z() })[team][res]++;
    out[team][res]++;
    if (why) { out[team].why++; out.groups[g][team].why++; }
    if (team === "blue" && res === "Fail") out.blueFails.push(id);
  }
  return out;
}
const pct = t => (t.Pass + t.Fail) ? Math.round(100 * t.Pass / (t.Pass + t.Fail)) : null;
const answered = t => t.Pass + t.Fail + t["N/A"];
const total = t => answered(t) + t.open;
const secs = s => { const m = String(s || "").match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/); return m ? (+m[1]) * 3600 + (+m[2]) * 60 + (+(m[3] || 0)) : null; };
const dur = d => d == null || d < 0 ? "" : (d >= 3600 ? Math.floor(d / 3600) + "h " : "") + Math.floor(d % 3600 / 60) + "m " + (d % 60) + "s";

// ---------- storage: shared db, or this device only when db is unavailable ----------
function localRuns() { try { return JSON.parse(localStorage.getItem("icpi-runs-v2") || "{}"); } catch (e) { return {}; } }
function localSave(id, body) { try { const r = localRuns(); r[id] = body; localStorage.setItem("icpi-runs-v2", JSON.stringify(r)); } catch (e) { setSync("Could not save on this device"); } }

function runsChanged() {
  const ids = Object.keys(allRuns).sort().reverse();
  $("run-select").innerHTML = `<option value="">All runs (${ids.length})</option>` +
    ids.map(id => `<option value="${esc(id)}"${id === current ? " selected" : ""}>${esc(id)}</option>`).join("");
  $("copy-from").innerHTML = `<option value="">Start empty</option>` +
    ids.map(id => `<option value="${esc(id)}">Copy crew, drones, targets from ${esc(id)}</option>`).join("");
  overview();
}

async function start() {
  [db, dl] = await Promise.all([use("db"), use("downloads")]);
  if (!db) { local = true; setSync("Saved on this device only"); allRuns = localRuns(); runsChanged(); }
  else {
    setSync("Synced");
    db.collection("runs").onSnapshot(snap => {
      allRuns = Object.fromEntries(snap.docs.map(d => [d.id, d.data() || {}]));
      runsChanged();
    }, e => setSync("Sync stopped (" + e.code + ")"));
  }
}

function openRun(id) {
  current = id || null;
  if (docUnsub) { docUnsub(); docUnsub = null; }
  $("home").hidden = !!id; $("card").hidden = !id; $("nav").hidden = !id;
  measureBar();
  if (!id) { overview(); return; }
  if (local) { state = structuredClone(localRuns()[id] || blank(id)); render(); return; }
  docUnsub = db.doc("runs/" + id).onSnapshot(snap => {
    if (!snap.exists) return;
    const incoming = structuredClone(snap.data());
    merge(incoming, structuredClone(pending));  // keep edits not yet written
    const typing = document.activeElement && $("card").contains(document.activeElement) && document.activeElement.tagName === "INPUT";
    state = incoming;
    if (!typing || !$("card").firstChild) render(); else refresh();
  }, e => setSync("Sync stopped (" + e.code + ")"));
}

// writes: merge only the changed branch, one write at a time, coalesced while typing
let pending = {}, timer = null, writing = false;
function queue(patch) {
  merge(pending, patch); merge(state, patch);
  clearTimeout(timer); timer = setTimeout(flush, 500); setSync("Saving…"); refresh();
}
function merge(a, b) { for (const k in b) { if (b[k] && typeof b[k] === "object" && !Array.isArray(b[k])) { if (!a[k] || typeof a[k] !== "object") a[k] = {}; merge(a[k], b[k]); } else a[k] = b[k]; } }
async function flush() {
  if (writing) { timer = setTimeout(flush, 300); return; }
  const patch = pending; pending = {};
  if (!Object.keys(patch).length) return;
  if (local) { localSave(current, state); allRuns[current] = structuredClone(state); setSync("Saved on this device only"); return; }
  writing = true;
  try { await db.doc("runs/" + current).update({ ...patch, updated_utc: new Date().toISOString() }); setSync("Saved " + utcTime().slice(0, 5) + " UTC"); }
  catch (e) { const again = structuredClone(patch); merge(again, pending); pending = again; setSync(e.code === "invalid_argument" ? "You can view but not edit this card" : "Not saved (" + e.code + "), will retry on next edit"); }
  finally { writing = false; }
}
const pathPatch = (path, value) => { const keys = path.split("."), patch = {}; let o = patch; keys.forEach((k, i) => { if (i === keys.length - 1) o[k] = value; else o = o[k] = {}; }); return patch; };

$("new-run-btn").onclick = () => { $("new-run").hidden = !$("new-run").hidden; if (!$("new-run").hidden) $("new-run-id").focus(); };
$("create-run").onclick = async () => {
  const raw = $("new-run-id").value.trim(), id = slug(raw);
  if (!id) { $("new-run-id").focus(); return; }
  const body = blank(raw), src = allRuns[$("copy-from").value];
  if (src) {
    COPY_FIELDS.forEach(k => { if (src.run?.[k]) body.run[k] = src.run[k]; });
    BLUE.forEach(([bid]) => { const t = src.items?.[bid]?.target; if (t) body.items[bid] = { target: t }; });
  }
  if (local) { localSave(id, body); allRuns = localRuns(); runsChanged(); }
  else {
    const ex = await db.doc("runs/" + id).get();
    if (!ex.exists) {
      try { await db.doc("runs/" + id).set(body); }
      catch (e) { setSync(e.code === "invalid_argument" ? "You can view but not create runs" : "Not created (" + e.code + ")"); return; }
    }

};

// Everything that follows from the data, updated in place so typing is never interrupted.
function refresh() {
  if (!state || !$("board")) return;
  const s = state, t = tally(s), all = { ...t.red }; for (const k in t.blue) all[k] += t.blue[k];
  const p = x => x == null ? "–" : x + " %";
  $("meta").textContent = [s.run?.date, s.run?.site, s.run?.n_drones && s.run.n_drones + " drones", s.run?.mode, s.updated_utc && "last saved " + s.updated_utc.slice(11, 16) + " UTC"].filter(Boolean).join(" · ");
  const bar = tt => `<div class="meter">${["Pass", "Fail", "N/A"].map(k => `<i style="width:${100 * tt[k] / total(tt)}%;background:var(--${k === "N/A" ? "na" : k.toLowerCase()})"></i>`).join("")}</div>`;
  $("board").innerHTML = `
    <div class="tile red"><div class="k">Red score</div><div class="v">${p(pct(t.red))}</div><div class="s">${t.red.Pass} pass · ${t.red.Fail} fail</div>${bar(t.red)}</div>
    <div class="tile blue"><div class="k">Blue score</div><div class="v">${p(pct(t.blue))}</div><div class="s">${t.blue.Pass} pass · ${t.blue.Fail} fail</div>${bar(t.blue)}</div>
    <div class="tile win"><div class="k">Red wins</div><div class="v">${t.blueFails.length}</div><div class="s">Blue checks failed</div></div>
    <div class="tile"><div class="k">Scored</div><div class="v">${Math.round(100 * answered(all) / total(all))} %</div><div class="s">${all.open} open · ${all.why} need a why</div></div>`;
  const cells = (team, g) => ALL.filter(r => r[0] === team && r[2] === g).map(([, id]) => {
    const st = t.states[id];
    return `<button type="button" class="cell ${st.res === "N/A" ? "NA" : st.res}${st.why || st.disagree ? " warn" : ""}" data-go="${id}" title="${id}: ${st.res === "open" ? "not scored" : st.res}${st.why ? ", write why" : ""}${st.disagree ? ", differs from the numbers" : ""}" aria-label="${id}"></button>`;
  }).join("");
  $("map").innerHTML = `<table><tr><th></th><th>Red</th><th>Blue</th></tr>${GROUPS.map(([g]) =>
    `<tr><td class="g">${g}</td><td><div class="cells">${cells("red", g)}</div></td><td><div class="cells">${cells("blue", g)}</div></td></tr>`).join("")}</table>
    <div class="legend"><span><i class="cell Pass"></i>Pass</span><span><i class="cell Fail"></i>Fail</span><span><i class="cell NA"></i>N/A</span><span><i class="cell"></i>Not scored</span><span><i class="cell warn"></i>Needs attention</span><span>Tap a square to jump to the check.</span></div>`;
  // phase timeline
  const ph = PHASES.map(([pid]) => ({ pid, a: secs(s.phases?.[pid]?.start), b: secs(s.phases?.[pid]?.end), off: s.phases?.[pid]?.used === "Not used" }));
  ph.forEach(x => { const el = $("dur-" + x.pid); if (el) el.textContent = x.a != null && x.b != null ? dur(x.b - x.a) : ""; });
  const okp = ph.filter(x => !x.off && x.a != null && x.b != null && x.b > x.a);
  if (!okp.length) $("tl").innerHTML = `<div class="none">Phase timeline appears when phase start and end times are written (Phase record, <b>Now</b> buttons).</div>`;
  else {
    const lo = Math.min(...okp.map(x => x.a)), hi = Math.max(...okp.map(x => x.b)), span = Math.max(1, hi - lo);
    const hms = x => new Date(x * 1000).toISOString().slice(11, 19);
    $("tl").innerHTML = `<div class="lane">${okp.map(x => `<div class="seg2" style="left:${100 * (x.a - lo) / span}%;width:${100 * (x.b - x.a) / span}%" title="${x.pid} ${dur(x.b - x.a)}">${x.pid} ${dur(x.b - x.a)}</div>`).join("")}</div>
      <div class="ax"><span>${hms(lo)} UTC</span><span>phases ${dur(hi - lo)}</span><span>${hms(hi)} UTC</span></div>`;
  }
  // rows
  for (const [, id] of ALL) {
    const row = $("row-" + id); if (!row) continue;
    const st = t.states[id], r = s.items?.[id]?.result || "";
    row.classList.toggle("off", st.off); row.classList.toggle("is-open", st.res === "open");
    row.classList.toggle("is-fail", st.res === "Fail"); row.classList.toggle("warn", st.why); row.classList.toggle("disagree", st.disagree);
    row.querySelectorAll("button[data-res]").forEach(b => { const on = b.dataset.v === r; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
    const h = $("hint-" + id);
    h.innerHTML = st.why ? `<span class="bad">Write why in the note</span>`
      : st.disagree ? `<span class="bad">Numbers suggest ${st.sug}</span>`
      : st.sug && st.res === "open" ? `<button type="button" data-apply="${id}" data-v="${st.sug}">Numbers suggest ${st.sug}: set</button>` : "";
  }
  // per-group progress and nav
  for (const [g] of GROUPS) for (const team of ["red", "blue"]) {
    const el = $(`pp-${team}-${g}`), tt = t.groups[g][team]; if (el) el.textContent = `${answered(tt)}/${total(tt)}`;
  }
  const runFilled = RUN_FIELDS.filter(([k]) => String(s.run?.[k] || "").trim()).length;
  const phFilled = PHASES.filter(([pid]) => s.phases?.[pid]?.used).length;
  const prog = { "s-run": [runFilled, RUN_FIELDS.length], "s-phases": [phFilled, PHASES.length], "s-red": [answered(t.red), total(t.red)], "s-blue": [answered(t.blue), total(t.blue)] };
  $("nav").querySelectorAll("a[data-sec]").forEach(a => { const v = prog[a.dataset.sec]; a.querySelector("b").textContent = v ? `${v[0]}/${v[1]}` : ""; a.classList.toggle("full", !!v && v[0] === v[1]); });
  // summary
  let h = `<thead><tr><th>Part</th><th class="num">Red pass</th><th class="num">Red fail</th><th class="num">Red score</th><th class="num">Blue pass</th><th class="num">Blue fail</th><th class="num">Blue score</th></tr></thead><tbody>`;
  GROUPS.forEach(([g, n]) => { const r = t.groups[g].red, b = t.groups[g].blue;
    h += `<tr><td>${esc(g === "RUN" ? "Run / data checks" : n)}</td><td class="num">${r.Pass}</td><td class="num">${r.Fail}</td><td class="num">${p(pct(r))}</td><td class="num">${b.Pass}</td><td class="num">${b.Fail}</td><td class="num">${p(pct(b))}</td></tr>`; });
  h += `<tr><td><b>Whole run</b></td><td class="num">${t.red.Pass}</td><td class="num">${t.red.Fail}</td><td class="num"><b>${p(pct(t.red))}</b></td><td class="num">${t.blue.Pass}</td><td class="num">${t.blue.Fail}</td><td class="num"><b>${p(pct(t.blue))}</b></td></tr></tbody>`;
  $("sum").innerHTML = h;
  $("redwins").innerHTML = `<b>Red team wins from Blue fails: ${t.blueFails.length}</b>` +
    (t.blueFails.length ? ` · ${t.blueFails.map(id => `<a href="#row-${id}">${id}</a> ${esc(BY_ID[id][3])}`).join(" · ")}` : " (no Blue row marked Fail yet).");
}

// ---------- export / import ----------
async function save(filename, data) {
  try { await dl.save({ filename, data }); $("tool-msg").textContent = "Saved " + filename; }
  catch (e) { $("tool-msg").textContent = e.code === "declined" ? "Not saved" : "Could not save (" + e.code + ")"; }
}
const csvq = v => /[",\n;]/.test(String(v ?? "")) ? `"${String(v).replace(/"/g, '""')}"` : String(v ?? "");
function toCsv() {
  const rows = [["team", "id", "phase", "check", "target", "value", "result", "note"]];
  for (const [team, id, g, q] of ALL) { const it = state.items?.[id] || {}; rows.push([team, id, g, q, it.target, it.value, isOff(state, g) ? "N/A (phase not used)" : it.result, it.note]); }
  return rows.map(r => r.map(csvq).join(",")).join("\n") + "\n";
}
function importValues(obj) {
  if (!obj || typeof obj !== "object" || !obj.items || typeof obj.items !== "object") throw new Error("Not a domeware scorecard file (no items).");
  let filled = 0, kept = 0, skipped = 0; const patch = { items: {} };
  for (const [id, v] of Object.entries(obj.items)) {
    if (!BY_ID[id] || !v || typeof v !== "object") { skipped++; continue; }
    for (const k of ["value", "note"]) {
      if (v[k] == null || v[k] === "") continue;
      const val = String(v[k]).slice(0, 300);
      if (String(state.items?.[id]?.[k] || "").trim()) { if (k === "value") kept++; continue; }
      (patch.items[id] ||= {})[k] = val; if (k === "value") filled++;
    }
  }
  if (obj.phases && typeof obj.phases === "object") for (const [pid, ph] of Object.entries(obj.phases)) {
    if (!PHASES.some(x => x[0] === pid) || !ph) continue;
    for (const k of ["start", "end"]) if (ph[k] && !state.phases?.[pid]?.[k]) ((patch.phases ||= {})[pid] ||= {})[k] = String(ph[k]).slice(0, 40);
  }
  if (Object.keys(patch.items).length || patch.phases) { queue(patch); render(); }
  return `Filled ${filled} values from ${obj.source || "domeware"}; kept ${kept} you had written${skipped ? `; ignored ${skipped} unknown ids` : ""}.`;
}

// ---------- events ----------
$("card").addEventListener("input", e => { const p = e.target.dataset?.path; if (p && e.target.tagName === "INPUT") queue(pathPatch(p, e.target.value)); });
$("card").addEventListener("change", e => {
  if (e.target.tagName === "SELECT" && e.target.dataset.path) queue(pathPatch(e.target.dataset.path, e.target.value));
  if (e.target.id === "imp-file" && e.target.files[0]) {
    const f = e.target.files[0]; e.target.value = "";
    f.text().then(t => { $("tool-msg").textContent = importValues(JSON.parse(t)); }).catch(err => { $("tool-msg").textContent = "Could not read the file: " + err.message; });
  }
});
$("card").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.res) {
    const id = b.dataset.res, cur = state.items?.[id]?.result || "", v = cur === b.dataset.v ? "" : b.dataset.v;
    queue({ items: { [id]: { result: v } } });
  } else if (b.dataset.apply) queue({ items: { [b.dataset.apply]: { result: b.dataset.v } } });
  else if (b.dataset.now) {
    const v = b.dataset.kind === "date" ? new Date().toISOString().slice(0, 10) : utcTime();
    const i = b.parentElement.querySelector("input"); i.value = v; queue(pathPatch(b.dataset.now, v));
  } else if (b.dataset.go) $("row-" + b.dataset.go)?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  else if (b.id === "imp-btn") $("imp-file").click();
  else if (b.id === "exp-json") save(slug(current) + ".json", JSON.stringify({ format: "icpi-run-scorecard/2", run_id: current, ...state }, null, 2));
  else if (b.id === "exp-csv") save(slug(current) + ".csv", toCsv());
});
$("nav").addEventListener("change", e => { if (e.target.id === "filter") { filter = e.target.value; $("card").dataset.filter = filter; } });
function measureBar() { document.documentElement.style.setProperty("--barh", $("bar").offsetHeight + "px"); }
addEventListener("resize", measureBar);
measureBar();
start();
</script>
