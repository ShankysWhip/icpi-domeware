<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>domeware HUD</title>
<link rel="stylesheet" href="/app/hud.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2316202c'/%3E%3Cg fill='none' stroke='%2335b4dc' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M6 24a10 10 0 0 1 20 0'/%3E%3Cpath d='M11 24a5 5 0 0 1 10 0'/%3E%3Cpath d='M16 24 23 12'/%3E%3C/g%3E%3C/svg%3E">
<meta name="color-scheme" content="light">
</head>
<body>
<div id="app">
  <header id="top">
    <button class="menu-btn" id="menuBtn" aria-label="Menu (M)" title="Menu (M)" aria-expanded="false" aria-controls="drawer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg>
    </button>
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18a9 9 0 0 1 18 0"/><path d="M7 18a5 5 0 0 1 10 0"/><circle cx="12" cy="18" r="1.4"/><path d="M12 18 18.5 7.5"/></svg>
      <b>DOMEWARE</b><span>REPLAY HUD</span>
    </div>
    <div class="crumbs"><span id="sessionName">—</span><i>/</i><span id="siteName">—</span><em id="simTag" hidden>SIMULATED</em></div>
    <div id="status" class="status"></div>
    <button class="help" id="helpBtn" aria-label="Keyboard keys">?</button>
  </header>

  <main id="stage">
    <div id="viewer"></div>
    <div id="loading">
      <div class="ring"><i></i></div>
      <div class="msg">INITIALISING 3D ENGINE</div>
      <div class="bar"><i></i></div>
      <div class="sub" id="loadSub">loading the viewer</div>
    </div>
    <div class="stage-label"><i></i>3D<b id="stageSite">—</b><em id="stageGeo"></em></div>
    <div id="mini" class="mini glass" hidden></div>
    <aside id="side">
      <section class="card glass" id="clock"></section>
      <div id="stack"></div>
    </aside>
    <nav id="rail" class="glass" aria-label="Instruments"></nav>
  </main>

  <footer id="timeline"></footer>
</div>

<div id="scrim"></div>
<nav id="drawer" aria-label="Menu" aria-hidden="true" inert></nav>
<div id="tip" class="tip" hidden></div>
<div id="lightbox" hidden>
  <div class="lb-frame">
    <img id="lbImg" alt="">
    <div class="lb-bar">
      <button id="lbPrev" title="Previous">‹</button>
      <div class="lb-cap"><b id="lbTime">—</b><span id="lbName"></span></div>
      <button id="lbJump">JUMP TO THIS MOMENT</button>
      <button id="lbNext" title="Next">›</button>
      <button id="lbClose" title="Close (Esc)">✕</button>
    </div>
  </div>
</div>

<script type="module" src="/app/hud.js"></script>
</body>
</html>
