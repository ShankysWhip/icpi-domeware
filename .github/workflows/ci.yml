# Tests on GitHub: every pull request and every change to main runs the same checks as on the laptop. A pull request
# is merged only when this is green. Real-data and Edge tests skip here (no session data, no viewer files).
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest  # the team's laptops run Windows
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install exactly the locked versions
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Height grids (so the N2000 and geoid tests run here too; they skip if this fails)
        run: uv run dw setup
        continue-on-error: true
        timeout-minutes: 5
      - name: Tests
        run: uv run pytest -q

  app:
    # The app (Orbit, app/) is plain JavaScript: its readers, analysis and CWA scoring are tested under Node here.
    # Tests that need a real recording skip (none is in git); the helper's own tests run on a Mac (decision 0002).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Every app script parses
        run: for f in app/web/js/*.js app/tests/*.js; do node --check "$f" || exit 1; done
      - name: Reader, analysis and CWA tests
        run: node app/tests/run_tests_node.js
